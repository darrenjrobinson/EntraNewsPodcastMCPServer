name: Weekly Database Update

on:
  schedule:
    # Wednesdays at 02:00 UTC — 12:00 midday AEST (UTC+10)
    - cron: '0 2 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ingestion mode'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write  # needed to create GitHub Releases

jobs:
  update-database:
    name: Ingest & Publish Updated Database
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # -----------------------------------------------------------------------
      # yt-dlp requires a JS runtime (deno by default) to solve YouTube's
      # player challenges; without it requests are flagged as bot traffic.
      - name: Set up Deno (JS runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # -----------------------------------------------------------------------
      # yt-dlp fetches playlist metadata + captions. pipx is preinstalled on
      # ubuntu-latest and always installs the current release (important —
      # YouTube changes break old yt-dlp versions).
      #
      # The curl-cffi extra is REQUIRED, not optional: YouTube's caption
      # endpoint needs a browser TLS fingerprint, and the extractor requests
      # impersonation for that download. Installed bare, yt-dlp reports "no
      # impersonate target is available" and the caption fetch 403s — which
      # looks like an IP block but is not one (2026-09-02 run 33584078963).
      - name: Install yt-dlp
        run: |
          pipx install "yt-dlp[default,curl-cffi]"
          yt-dlp --version
          # Fail fast and legibly here rather than mid-ingest if the extra
          # ever silently stops providing an impersonation backend.
          if ! yt-dlp --list-impersonate-targets | grep -qiE 'chrome|edge|safari'; then
            echo "::error::yt-dlp has no impersonation targets — the curl-cffi extra did not install correctly."
            exit 1
          fi
          echo "Impersonation targets available:"
          yt-dlp --list-impersonate-targets | head -5

      # -----------------------------------------------------------------------
      # YouTube's caption/timedtext endpoint requires a PO (Proof-of-Origin)
      # token for the web/web_safari clients yt-dlp uses by default — without
      # one, subtitle downloads 429 regardless of source IP. Confirmed
      # 2026-09-09: the identical failure reproduced from four different exit
      # IPs (two IPRoyal identities in two countries, plus a clean home
      # residential IP with no proxy at all) on both a brand-new and an
      # already-successfully-ingested video — YTDLP_PROXY does NOT fix this.
      # See https://github.com/yt-dlp/yt-dlp/wiki/PO-Token-Guide and
      # https://github.com/Brainicism/bgutil-ytdlp-pot-provider.
      #
      # Uses the "script" provider (spawns per request) rather than the HTTP
      # server option — no persistent process to manage on a short-lived
      # runner. Node is already set up above; the plugin auto-discovers the
      # provider at its default path (~/bgutil-ytdlp-pot-provider), no
      # extractor-args needed.
      - name: Set up PO token provider (yt-dlp caption downloads)
        env:
          # The server (git tag) and plugin (PyPI package) are two separately
          # versioned halves of the same tool and must match — bump BOTH
          # together, never just one, or a newer plugin can silently speak a
          # protocol the older pinned server doesn't support (or vice versa).
          # https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases
          BGUTIL_VERSION: 2.0.0
        run: |
          git clone --single-branch --branch "$BGUTIL_VERSION" \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git \
            "$HOME/bgutil-ytdlp-pot-provider"
          cd "$HOME/bgutil-ytdlp-pot-provider/server"
          npm ci
          npx tsc
          cd "$GITHUB_WORKSPACE"

          # yt-dlp is pipx-installed, so the plugin must be injected into its
          # isolated venv — a plain `pip install` would land elsewhere and
          # yt-dlp would never see it.
          pipx inject yt-dlp "bgutil-ytdlp-pot-provider==$BGUTIL_VERSION"

          # Fail visibly (but not fatally — the real ingest step gives a
          # precise CAPTION_RATE_LIMITED error if this didn't take) if yt-dlp
          # doesn't report a WORKING bgutil provider. Matching just
          # "PO Token Providers: bgutil" isn't enough — that substring is
          # present even when every bgutil entry is suffixed
          # "(external, unavailable)" (confirmed 2026-09-09 during a cold
          # first-run before the script warmed up). Require an entry that's
          # "(external)" with nothing else in the parens.
          if ! yt-dlp -v --skip-download --simulate "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 \
              | grep -qE "bgutil:script-(node|deno)-[0-9.]+ \(external\)"; then
            echo "::warning::yt-dlp did not report a usable bgutil PO token provider — caption downloads may still 429."
          fi

      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      - name: Build TypeScript
        run: npm run build

      # -----------------------------------------------------------------------
      - name: Download latest database from GitHub Releases
        id: download_db
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking for existing database release..."

          RELEASE_TAG=$(gh release list \
            --repo "${{ github.repository }}" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' \
            2>/dev/null || true)
          echo "Latest release tag: '$RELEASE_TAG'"

          if [ -z "$RELEASE_TAG" ]; then
            echo "No releases found — running full ingest."
            echo "db_existed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Attempting to download entra-news-podcasts.db from release '$RELEASE_TAG'..."
            if gh release download "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "entra-news-podcasts.db" \
              --output entra-news-podcasts.db \
              2>&1; then
              echo "db_existed=true" >> "$GITHUB_OUTPUT"
              ls -lh entra-news-podcasts.db
            else
              echo "Asset entra-news-podcasts.db not found in release '$RELEASE_TAG' — running full ingest."
              echo "db_existed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # -----------------------------------------------------------------------
      - name: Determine ingestion mode
        id: mode
        run: |
          INPUT_MODE="${{ github.event.inputs.mode || 'incremental' }}"
          DB_EXISTED="${{ steps.download_db.outputs.db_existed }}"

          if [ "$DB_EXISTED" = "false" ] || [ "$INPUT_MODE" = "full" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Mode: full ingest"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
            echo "Mode: incremental ingest"
          fi

      # -----------------------------------------------------------------------
      # The last-good DB release stays --latest so consumers are unaffected by
      # a failure here either way.
      # - CAPTION_RATE_LIMITED: either the PO token provider step above didn't
      #   take, or this video has multiple audio/dub tracks and resolved to
      #   the translated caption bucket (see pickCaptionLanguage in
      #   scripts/lib/ytdlp.ts) — the error message can't tell you which.
      #   YTDLP_PROXY will NOT fix either cause — see that step's comment.
      # - BOT_BLOCKED: YouTube is refusing this runner's IP on general
      #   page/API requests (not captions specifically). Set the YTDLP_PROXY
      #   repo secret to a proxy URL (picked up here with no code change).
      # Either way, running the ingest locally and uploading manually (see
      # README) is always the fallback.
      - name: Run ingestion pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_DB_PATH: ./entra-news-podcasts.db
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          if [ "$MODE" = "incremental" ]; then
            node dist/scripts/ingest.js --incremental
          else
            node dist/scripts/ingest.js
          fi

      # -----------------------------------------------------------------------
      # Heal any embedding gaps (e.g. from a past keyless or failed-embed run).
      # Talks only to the OpenAI API — no YouTube access, so it cannot be
      # bot-blocked. No-op when coverage is already complete.
      - name: Backfill missing embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_DB_PATH: ./entra-news-podcasts.db
        run: node dist/scripts/ingest.js --embed-missing

      # -----------------------------------------------------------------------
      - name: Verify database
        run: |
          if [ ! -f ./entra-news-podcasts.db ]; then
            echo "ERROR: Database file not found after ingestion!"
            exit 1
          fi
          ls -lh ./entra-news-podcasts.db

          EPISODE_COUNT=$(sqlite3 ./entra-news-podcasts.db "SELECT value FROM meta WHERE key='episode_count';" 2>/dev/null || echo "0")
          CHUNK_COUNT=$(sqlite3 ./entra-news-podcasts.db "SELECT COUNT(*) FROM chunks;" 2>/dev/null || echo "0")
          GUEST_COUNT=$(sqlite3 ./entra-news-podcasts.db "SELECT value FROM meta WHERE key='guest_count';" 2>/dev/null || echo "0")
          MISSING_EMBEDDINGS=$(sqlite3 ./entra-news-podcasts.db "SELECT COUNT(*) FROM chunks WHERE id NOT IN (SELECT chunk_id FROM vec_embeddings);" 2>/dev/null || echo "unknown")
          echo "Episodes: $EPISODE_COUNT"
          echo "Chunks: $CHUNK_COUNT"
          echo "Guests: $GUEST_COUNT"
          echo "Chunks without embeddings: $MISSING_EMBEDDINGS"

          if [ "$EPISODE_COUNT" = "0" ] || [ -z "$EPISODE_COUNT" ]; then
            echo "ERROR: No episodes in database!"
            exit 1
          fi
          if [ "$MISSING_EMBEDDINGS" != "0" ]; then
            echo "::warning::$MISSING_EMBEDDINGS chunk(s) have no embedding — semantic search coverage is incomplete."
          fi

          echo "episode_count=$EPISODE_COUNT" >> "$GITHUB_ENV"
          echo "chunk_count=$CHUNK_COUNT" >> "$GITHUB_ENV"
          echo "guest_count=$GUEST_COUNT" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y.%m.%d)
          RUN=$(echo "${{ github.run_number }}" | xargs printf "%04d")
          TAG="db-${DATE}-${RUN}"
          # Manual releases can occupy the tag (e.g. the bot-block fallback) —
          # suffix a timestamp instead of failing the run
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            TAG="${TAG}-$(date -u +%H%M%S)"
            echo "Tag collision — using ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      # -----------------------------------------------------------------------
      - name: Create GitHub Release with updated database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=$(cat <<EOF
          ## Entra.Chat Podcast Database Update

          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Mode:** ${{ steps.mode.outputs.mode }}
          **Episodes indexed:** ${{ env.episode_count }}
          **Chunks:** ${{ env.chunk_count }}
          **Guests:** ${{ env.guest_count }}

          ### Usage

          This database is automatically downloaded by the \`entra-news-podcast-mcp\` NPX package on first run.
          No manual steps required.

          To use manually:
          \`\`\`bash
          npx entra-news-podcast-mcp
          \`\`\`
          EOF
          )

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Database Update $TAG" \
            --notes "$NOTES" \
            --latest \
            ./entra-news-podcasts.db

          echo "Released: $TAG"

      # -----------------------------------------------------------------------
      - name: Summary
        run: |
          echo "### Database Update Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | ${{ steps.tag.outputs.tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | ${{ steps.mode.outputs.mode }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Episodes indexed | ${{ env.episode_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chunks | ${{ env.chunk_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Guests | ${{ env.guest_count }} |" >> "$GITHUB_STEP_SUMMARY"
          ls -lh entra-news-podcasts.db | awk '{print "| DB size | " $5 " |"}' >> "$GITHUB_STEP_SUMMARY"
